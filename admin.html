<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAI 관리자</title><link rel="stylesheet" href="style.css"></head><body><div class="admin-wrap"><aside class="admin-side"><h2>SAI ADMIN</h2><button data-admin="dashboard" class="active">대시보드</button><button data-admin="menu">메뉴·레시피</button><button data-admin="cost">원가 계산</button><button data-admin="memories">추억 관리</button><button data-admin="recipes">당신의 사이</button><button data-admin="backup">백업</button><a class="btn" href="index.html" style="display:block;margin-top:20px">고객 화면 보기</a></aside><main class="admin-main">
<section id="admin-dashboard" class="admin-section"><div class="eyebrow">ADMIN DASHBOARD</div><h1>사이 운영 관리</h1><div class="notice">현재 버전은 실행형 프로토타입으로 같은 브라우저의 LocalStorage에 저장됩니다. 여러 손님이 동시에 공유하려면 다음 단계에서 서버 DB와 관리자 로그인을 연결해야 합니다.</div><div id="stats" style="margin-top:18px"></div></section>
<section id="admin-menu" class="admin-section hidden"><h1>메뉴와 레시피 관리</h1><div class="card full"><label>메뉴 선택</label><select id="itemSelect"></select><input type="hidden" id="editId"><div class="formgrid"><div><label>이름</label><input id="name"></div><div><label>카테고리</label><input id="category"></div><div><label>판매가</label><input id="price" type="number"></div><div><label>도수</label><input id="abv"></div><div><label>내부 점수</label><input id="score" type="number"></div><div><label>1잔 원가</label><input id="cost" type="number"></div></div><label>고객용 감성 설명</label><textarea id="copy" rows="4"></textarea><label>직원용 정확한 레시피·제조법</label><textarea id="recipe" rows="5"></textarea><button class="btn primary" id="saveItem">저장</button></div></section>
<section id="admin-cost" class="admin-section hidden"><h1>원가 계산기</h1><div class="notice">당신의 사이는 최소 14,000원이며, 선택 기주·리큐르·도수에 따른 예상 원가와 목표 원가율을 기준으로 더 높은 가격을 자동 제안합니다.</div><div class="card full"><div class="formgrid"><div><label>병 구매가</label><input id="bottlePrice" type="number"></div><div><label>병 용량 ml</label><input id="bottleMl" type="number" value="700"></div><div><label>사용량 ml</label><input id="pourMl" type="number" value="30"></div><div><label>부재료 원가</label><input id="extraCost" type="number" value="0"></div><div><label>판매가</label><input id="salePrice" type="number" value="13000"></div><div><label>목표 원가율 %</label><input id="targetRate" type="number" value="20"></div></div><button class="btn primary" id="calcBtn">계산</button><div id="calcResult" style="margin-top:18px"></div></div></section>
<section id="admin-memories" class="admin-section hidden"><h1>사이의 추억 관리</h1><div id="moderation" class="grid"></div></section>
<section id="admin-recipes" class="admin-section hidden"><h1>당신의 사이 · 이달의 칵테일</h1><div id="adminRecipes" class="grid"></div></section>
<section id="admin-backup" class="admin-section hidden"><h1>데이터 백업</h1><div class="card full"><button class="btn primary" id="exportBtn">JSON 백업 내려받기</button><button class="btn" id="resetBtn">초기 데이터 복원</button></div></section>
</main></div><script src="admin.js"></script></body></html>
