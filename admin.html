<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAI 관리자</title><link rel="stylesheet" href="css/style.css"></head><body><header><div class="container"><nav><div class="logo">SAI 관리자</div><a href="index.html">손님 화면</a></nav></div></header><main class="section"><div class="container"><h1>메뉴 · 원가 · 점수 관리</h1><div class="notice">현재는 브라우저 LocalStorage 저장 방식입니다. 운영 전 서버 DB와 관리자 로그인이 필요합니다.</div><div class="grid" style="margin-top:18px">
<section class="card wide"><h2>메뉴 편집</h2><label>메뉴 선택</label><select id="sel"></select><div class="formgrid"><div><label>이름</label><input id="name"></div><div><label>카테고리</label><input id="category"></div><div><label>가격</label><input id="price" type="number"></div><div><label>1잔 원가</label><input id="cost" type="number"></div><div><label>도수</label><input id="abv"></div><div><label>점수</label><input id="score" type="number"></div></div><label>한줄평</label><textarea id="oneLine"></textarea><label>스토리</label><textarea id="story"></textarea><label>편지</label><textarea id="letter"></textarea><button id="save" class="btn primary">저장</button></section>
<section class="card wide"><h2>원가 계산기</h2><div class="formgrid"><div><label>병 구매가</label><input id="bp" type="number"></div><div><label>병 용량 ml</label><input id="bm" type="number" value="700"></div><div><label>사용량 ml</label><input id="pm" type="number" value="30"></div><div><label>부재료 원가</label><input id="extra" type="number" value="0"></div><div><label>판매가</label><input id="sale" type="number" value="13000"></div><div><label>목표 원가율 %</label><input id="target" type="number" value="20"></div></div><button id="calc" class="btn primary">계산</button><div id="out"></div></section>
<section class="card full"><h2>데이터 백업</h2><button id="exportBtn" class="btn">JSON 내보내기</button><button id="resetBtn" class="btn">초기화</button><input id="importFile" type="file" accept=".json"></section></div></div></main>
<script src="js/app.js"></script><script>let d,all,current;const $=x=>document.getElementById(x);loadData().then(x=>{d=x;all=items(d);sel.innerHTML=all.map((x,i)=>`<option value="${i}">${x.category} · ${x.name}</option>`).join("");load(0)});function load(i){current=all[i];["name","category","price","cost","abv","score","oneLine","story","letter"].forEach(k=>$(k).value=current[k]??"")}sel.onchange=e=>load(+e.target.value);save.onclick=()=>{["name","category","abv","oneLine","story","letter"].forEach(k=>current[k]=$(k).value);["price","cost","score"].forEach(k=>current[k]=+$(k).value||0);localStorage.setItem(KEY,JSON.stringify(d));alert("저장되었습니다.")};calc.onclick=()=>{let liquid=+bp.value/+bm.value*+pm.value,total=liquid+(+extra.value),r=total/(+sale.value)*100,suggested=Math.ceil((total/(+target.value/100))/500)*500;out.innerHTML=`<p>주류 원가 <b>${won(Math.round(liquid))}</b></p><p>총 원가 <b>${won(Math.round(total))}</b></p><p>현재 원가율 <b>${r.toFixed(1)}%</b></p><p>권장 판매가 <b>${won(suggested)}</b></p>`};exportBtn.onclick=()=>{let b=new Blob([JSON.stringify(d,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="sai-menu-backup.json";a.click()};resetBtn.onclick=()=>{if(confirm("초기화할까요?")){localStorage.removeItem(KEY);location.reload()}};importFile.onchange=e=>{let r=new FileReader();r.onload=()=>{d=JSON.parse(r.result);localStorage.setItem(KEY,JSON.stringify(d));location.reload()};r.readAsText(e.target.files[0])}</script></body></html>
