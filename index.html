<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAI 사이</title><link rel="stylesheet" href="css/style.css"></head><body>
<div id="splash"><div class="glow"></div><button id="skip">건너뛰기</button><div><div class="brand">SAI</div><div class="line l1">오늘 하루,<br>여기서 잠깐 쉬어가세요.</div><div class="line l2">한 잔은 비워도,<br>오늘의 기억은 남습니다.</div></div></div>
<header><div class="container"><nav><div class="logo">SAI 사이</div><div class="navlinks"><a href="#ai">AI 추천</a><a href="#sig">시그니처</a><a href="#menu">메뉴</a><a href="admin.html">관리자</a></div></nav></div></header>
<main><section class="hero"><div class="container"><div class="kicker">SAI WEB V1</div><h1>오늘의 취향과<br>사이의 한 잔.</h1><p>가격대, 도수, 취향과 분위기에 맞춰 메뉴를 추천합니다.</p></div></section>
<section id="ai" class="section"><div class="container"><h2>AI 취향 추천</h2><div class="card full"><div class="formgrid"><div><label>예산</label><select id="budget"><option value="12000">12,000원 이하</option><option value="14000" selected>14,000원 이하</option><option value="999999">무관</option></select></div><div><label>도수</label><select id="str"><option value="low">가볍게</option><option value="mid" selected>중간</option><option value="high">강하게</option><option value="none">논알콜</option></select></div></div><button class="btn primary" id="go" style="margin-top:14px">추천받기</button><div id="result"></div></div></div></section>
<section id="sig" class="section"><div class="container"><h2>사이 시그니처</h2><div id="siggrid" class="grid"></div></div></section>
<section id="menu" class="section"><div class="container"><h2>전체 메뉴</h2><div id="filters" class="filters"></div><div id="menugrid" class="grid"></div></div></section></main>
<script src="js/app.js"></script><script>splash();loadData().then(d=>{cards(d.signatures,d,siggrid);const cs=["전체",...new Set(d.menu.map(x=>x.category))];filters.innerHTML=cs.map((c,i)=>`<button class="${i?'':'active'}" data-c="${c}">${c}</button>`).join("");const draw=c=>cards(c==="전체"?d.menu:d.menu.filter(x=>x.category===c),d,menugrid);draw("전체");filters.onclick=e=>{if(e.target.tagName!="BUTTON")return;[...filters.children].forEach(x=>x.classList.remove("active"));e.target.classList.add("active");draw(e.target.dataset.c)};go.onclick=()=>{let list=items(d).filter(x=>x.price<=+budget.value);list=list.map(x=>{let r=x.score||70,a=x.abv||"";if(str.value==="none"&&(a.includes("논알콜")||x.category.includes("논알콜")))r+=30;if(str.value==="low"&&(a.includes("가벼")||a.includes("6~8")))r+=15;if(str.value==="high"&&(a.includes("높")||a.includes("30")||a.includes("50")||a.includes("60")))r+=18;return {...x,r}}).sort((a,b)=>b.r-a.r).slice(0,3);result.innerHTML='<h3>오늘의 추천</h3><div class="grid">'+list.map(x=>`<div class="card"><div class="kicker">${x.category}</div><h3>${x.name}</h3><p>${x.oneLine}</p><b>${won(x.price)}</b></div>`).join("")+"</div>"}});</script></body></html>
