<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>사이 테이블 QR 만들기 V3.2</title>
<style>
:root{--bg:#ededed;--ink:#111;--gold:#e8aa42;--brown:#2b241d;--muted:#9d8d79}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Wanted Sans","Pretendard","Noto Sans KR",sans-serif;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#111;color:#fff;padding:26px 28px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333}
.brand{display:flex;gap:16px;align-items:center;font-size:25px;font-weight:800}
.logo{font-size:42px;font-weight:700;text-shadow:0 0 8px #fff9,0 0 20px #e8c27f}
button,a.btn{appearance:none;border:0;border-radius:24px;background:var(--gold);color:#111;font-weight:800;font-size:19px;padding:15px 22px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
main{padding:24px}
.panel{background:#fff;border:2px solid var(--brown);border-radius:28px;padding:22px;margin-bottom:22px}
.version{font-size:14px;color:#6f6253;margin:0 0 14px;font-weight:700}
label{display:block;font-size:17px;color:var(--muted);margin:10px 0 8px}
input{width:100%;padding:18px;border:2px solid #bbb;border-radius:18px;font-size:19px;background:#fff;color:#111}
#siteUrl{background:#f8f8f8}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.status{margin:14px 0 0;color:#6f6253;font-size:14px;line-height:1.5}
.grid{display:grid;grid-template-columns:1fr;gap:18px}
.card{background:#fff;border:2px solid var(--brown);border-radius:24px;padding:20px;text-align:center;break-inside:avoid}
.card .logo{font-size:34px}
.card h2{margin:8px 0 4px;font-size:28px}
.card img{display:block;width:220px;height:220px;max-width:100%;margin:14px auto;background:#fff}
.card small{display:block;word-break:break-all;color:#756858;margin:8px 0 14px;line-height:1.4}
.test{font-size:16px;padding:13px 18px}
@media(min-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
@media print{header,.panel,.test{display:none!important}main{padding:0}body{background:#fff}.grid{grid-template-columns:repeat(2,1fr);gap:8px}.card{border:1px solid #777}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">사이</span><span>테이블 QR 만들기</span></div>
  <button type="button" onclick="window.print()">인쇄하기</button>
</header>

<main>
  <section class="panel">
    <p class="version">SAI QR V3.2 · 자동 생성형</p>
    <label>배포 사이트 주소</label>
    <input id="siteUrl" value="https://sai-web-gilt.vercel.app" readonly>
    <label>좌석 수</label>
    <input id="seatCount" type="number" min="1" max="14" value="14">
    <div class="actions"><button id="makeQr" type="button">QR 다시 생성</button></div>
    <p id="status" class="status">페이지가 열리면 1~14번 자리 QR이 자동으로 생성됩니다.</p>
  </section>
  <section id="grid" class="grid"></section>
</main>

  const siteUrl = document.getElementById("siteUrl");
  const seatCount = document.getElementById("seatCount");
  const makeQr = document.getElementById("makeQr");
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");

  function renderQRs(scroll) {
    let count = Number.parseInt(seatCount.value || "14", 10);
    if (!Number.isFinite(count)) count = 14;
    count = Math.max(1, Math.min(14, count));
    seatCount.value = String(count);
    grid.innerHTML = "";
    const base = siteUrl.value.replace(/\/$/, "");
    for (let i = 1; i <= count; i++) {
      const orderUrl = base + "/?table=" + i;
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML =
        '<div class="logo">사이</div>' +
        '<h2>' + i + '번 자리</h2>' +
        '<img src="' + QR_IMAGES[i] + '" alt="' + i + '번 자리 주문 QR">' +
        '<small>' + orderUrl + '</small>' +
        '<a class="btn test" href="' + orderUrl + '">이 자리로 주문 테스트</a>';
      grid.appendChild(card);
    }
    status.textContent = "SAI QR V3.2 · " + count + "개 자리 QR 생성 완료";
    if (scroll) setTimeout(() => grid.scrollIntoView({behavior:"smooth",block:"start"}), 50);
  }

  makeQr.addEventListener("click", () => renderQRs(true));
  seatCount.addEventListener("change", () => renderQRs(false));
  renderQRs(false);
})();
</script>
